<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Custom Font Generator</title>
    <style>
        /* STEP 1: Load your font from the web */
        @font-face {
            font-family: 'MyCustomFont'; /* Give your font a name to use in CSS */
            src: url('willowscriptmodd-webfont.woff2') format('woff2'), /* IMPORTANT: Change this to your file name */
                 url('willowscriptmodd.ttf') format('truetype'); /* IMPORTANT: Change this to your file name */
            font-weight: normal;
            font-style: normal;
        }

        /* Basic styling for the page */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 600px;
        }
        h1 {
            margin-top: 0;
        }

        /* The input box where you type */
        #textInput {
            width: 100%;
            padding: 10px;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }

        /* The display area with YOUR font */
        #fontDisplay {
            font-family: 'MyCustomFont', Arial, sans-serif; /* STEP 2: Apply your font! */
            font-size: 2.5rem;
            min-height: 80px;
            padding: 10px;
            background-color: #eef;
            border: 1px dashed #ccc;
            margin-bottom: 1rem;
            word-wrap: break-word;
            white-space: pre-wrap; /* Preserves spaces and line breaks */
        }

        /* The copy button */
        #copyButton {
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        #copyButton:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>My Custom Font Generator</h1>
        <p>Type in the box below to see your text in your font!</p>
        
        <input type="text" id="textInput" placeholder="Type your text here...">
        
        <div id="fontDisplay"></div>
        
        <button id="copyButton">Copy Text</button>
    </div>

    <script>
        // Get the HTML elements
        const textInput = document.getElementById('textInput');
        const fontDisplay = document.getElementById('fontDisplay');
        const copyButton = document.getElementById('copyButton');

        // Add an event listener to the input box
        // This runs every time the user types
        textInput.addEventListener('input', () => {
            // Copy the text from the input to the display area
            fontDisplay.textContent = textInput.value;
        });

        // Add an event listener to the copy button
        copyButton.addEventListener('click', () => {
            // Get the text to copy
            const textToCopy = textInput.value;

            // Use the Clipboard API to copy the text
            navigator.clipboard.writeText(textToCopy).then(() => {
                // Give the user feedback
                copyButton.textContent = 'Copied!';
                setTimeout(() => {
                    copyButton.textContent = 'Copy Text';
                }, 2000); // Reset button text after 2 seconds
            }).catch(err => {
                console.error('Failed to copy text: ', err);
                alert('Sorry, could not copy text.');
            });
        });
    </script>

</body>
</html>
